packages:
  - libs/*
  - demo

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  less: false
  lmdb: false
  msgpackr-extract: false
  rollup: false

minimumReleaseAge: 4320

catalog:
  '@angular/build': '22.2.0'
  '@angular/cdk': '22.2.1'
  '@angular/cli': '22.2.0'
  '@angular/common': '22.2.1'
  '@angular/compiler': '22.2.1'
  '@angular/compiler-cli': '22.2.1'
  '@angular/core': '22.2.1'
  '@angular/forms': '22.2.1'
  '@angular/material': '22.2.1'
  '@angular/platform-browser': '22.2.1'
  '@angular/router': '22.2.1'
  '@types/node': '24.19.0'
  '@vitest/browser-playwright': '5.0.3'
  '@vitest/coverage-v8': '5.0.3'
  angular-eslint: '22.5.0'
  cpy-cli: '7.0.0'
  dayjs: '1.11.23'
  eslint: '10.11.0'
  marked: '18.0.14'
  ng-packagr: '22.2.3'
  ngx-markdown: '22.1.0'
  oxfmt: '0.71.0'
  oxlint: '1.86.0'
  playwright: '1.63.0'
  prismjs: '1.30.0'
  rxjs: '7.8.2'
  tslib: '2.8.1'
  typescript: '7.0.2'
  typescript-eslint: '8.71.0'
  vitest: '5.0.3'
  zone.js: '0.16.3' # without this, the tests fail since Angular v22

dedupePeers: true

overrides:
  sass: ^1.99.0 # without this, timeouts may occur in the tests
