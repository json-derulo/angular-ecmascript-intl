packages:
  - libs/*
  - demo

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  less: false
  lmdb: false
  msgpackr-extract: false
  rollup: false

minimumReleaseAge: 4320

catalog:
  '@angular/build': '22.1.5'
  '@angular/cdk': '22.1.3'
  '@angular/cli': '22.1.5'
  '@angular/common': '22.1.3'
  '@angular/compiler': '22.1.3'
  '@angular/compiler-cli': '22.1.3'
  '@angular/core': '22.1.3'
  '@angular/forms': '22.1.3'
  '@angular/material': '22.1.3'
  '@angular/platform-browser': '22.1.3'
  '@angular/router': '22.1.3'
  '@types/node': '24.13.3'
  '@vitest/browser-playwright': '4.1.11'
  '@vitest/coverage-v8': '4.1.11'
  angular-eslint: '22.1.0'
  cpy-cli: '7.0.0'
  dayjs: '1.11.23'
  eslint: '10.8.1'
  marked: '18.0.10'
  ng-packagr: '22.1.1'
  ngx-markdown: '22.0.0'
  oxfmt: '0.64.0'
  oxlint: '1.79.0'
  playwright: '1.62.1'
  prismjs: '1.30.0'
  rxjs: '7.8.2'
  tslib: '2.8.1'
  typescript: '6.0.3'
  typescript-eslint: '8.67.0'
  vitest: '4.1.11'
  zone.js: '0.16.2' # without this, the tests fail since Angular v22

dedupePeers: true

overrides:
  sass: ^1.99.0 # without this, timeouts may occur in the tests
