packages:
  - libs/*
  - demo

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  less: false
  lmdb: false
  msgpackr-extract: false
  rollup: false

minimumReleaseAge: 4320

catalog:
  '@angular/build': '22.2.5'
  '@angular/cdk': '22.2.5'
  '@angular/cli': '22.2.5'
  '@angular/common': '22.2.4'
  '@angular/compiler': '22.2.4'
  '@angular/compiler-cli': '22.2.4'
  '@angular/core': '22.2.4'
  '@angular/forms': '22.2.4'
  '@angular/material': '22.2.5'
  '@angular/platform-browser': '22.2.4'
  '@angular/router': '22.2.4'
  '@types/node': '26.6.6'
  '@vitest/browser-playwright': '5.1.0'
  '@vitest/coverage-v8': '5.1.0'
  angular-eslint: '22.6.0'
  cpy-cli: '7.0.0'
  dayjs: '1.11.23'
  eslint: '10.14.0'
  marked: '18.1.3'
  ng-packagr: '22.2.6'
  ngx-markdown: '22.1.1'
  oxfmt: '0.76.0'
  oxlint: '1.91.0'
  playwright: '1.64.1'
  prismjs: '1.30.0'
  rxjs: '7.8.2'
  tslib: '2.9.1'
  typescript: '6.0.3'
  typescript-eslint: '8.72.1'
  vitest: '5.1.0'
  zone.js: '0.16.3' # without this, the tests fail since Angular v22

dedupePeers: true

overrides:
  sass: ^1.99.0 # without this, timeouts may occur in the tests
